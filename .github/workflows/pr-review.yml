name: night-pr-reviewer

on:
  schedule:
    # Every 15 min — PR review scan
    - cron: '*/15 * * * *'
    # Daily digest trigger (7am UTC = 12:30pm IST)
    - cron: '0 7 * * *'
  # Allow manual trigger from Actions tab for testing / video demo
  workflow_dispatch:

# Prevent overlapping runs if a scan takes longer than the interval
concurrency:
  group: pr-reviewer
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'

      - name: Install deps
        run: pip install -r agent/requirements.txt

      - name: Run PR reviewer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN_PAT: ${{ secrets.PR_REVIEWER_PAT }}
          REPOS: ${{ secrets.REPOS }}
          # Opt-in to auto-close. Defaults to false if unset.
          # The agent will close a PR only if ALL three pass:
          #   verdict=request_changes AND confidence=high AND severity_score>=9
          ALLOW_AUTO_CLOSE: ${{ vars.ALLOW_AUTO_CLOSE || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python agent/pr_reviewer.py

      # Daily digest — fires on 7am UTC schedule OR any workflow_dispatch
      # (cron-job.org triggers via workflow_dispatch, so demo runs send email too)
      - name: Send daily digest
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python agent/send_digest.py
